services:
  inngest:
    image: inngest/inngest:v1.39.0
    command: ["inngest", "start"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8288:8288"
      - "127.0.0.1:8289:8289"
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?set INNGEST_EVENT_KEY in .env}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?set INNGEST_SIGNING_KEY in .env}
      INNGEST_SQLITE_DIR: /data
    volumes:
      - inngest-data:/data
    healthcheck:
      test: ["CMD", "inngest", "alpha", "doctor", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  inngest-data:
