services:
  # Inngest - Event queue
  inngest:
    image: inngest/inngest:v1.39.0
    command: ["inngest", "start"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8288:8288"
      - "127.0.0.1:8289:8289"
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?set INNGEST_EVENT_KEY in .env}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?set INNGEST_SIGNING_KEY in .env}
      INNGEST_SQLITE_DIR: /data
    volumes:
      - inngest-data:/data
    healthcheck:
      test: ["CMD", "inngest", "alpha", "doctor", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - devteam

  # Codex App Server - Agent runtime
  appserver:
    build:
      context: .
      dockerfile: Dockerfile
    command: codex app-server --listen ws://0.0.0.0:9876
    restart: unless-stopped
    ports:
      - "127.0.0.1:9876:9876"
    environment:
      CODEX_HOME: /codex-home
      CODEX_APP_SERVER_URL: ws://0.0.0.0:9876
    volumes:
      # Mount codex home from host (read-write for sqlite)
      - ${CODEX_HOME:-~/.codex}:/codex-home:rw
      # Mount workspace for agents to access
      - ${WORKSPACE_PATH:-..}:${WORKSPACE_PATH:-..}:rw
    networks:
      - devteam
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9876/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Dashboard Server - API
  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:server
    working_dir: /app/dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      INNGEST_DEV: ${INNGEST_DEV:-0}
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_GATEWAY_URL: ws://inngest:8289/v0/connect
      CODEX_APP_SERVER_URL: ws://appserver:9876
      DASHBOARD_APP_SERVER_AUTO_APPROVE: ${DASHBOARD_APP_SERVER_AUTO_APPROVE:-true}
      DEVTEAM_AGENT_CONCURRENCY: ${DEVTEAM_AGENT_CONCURRENCY:-3}
      DEVTEAM_AGENT_TIMEOUT: ${DEVTEAM_AGENT_TIMEOUT:-6h}
      DEVTEAM_BLOCKED_TTL: ${DEVTEAM_BLOCKED_TTL:-30d}
      DASHBOARD_CODEX_HOME: /codex-home
    volumes:
      # Mount codex home from host
      - ${CODEX_HOME:-~/.codex}:/codex-home:rw
      # Mount workspace for agents to access
      - ${WORKSPACE_PATH:-..}:${WORKSPACE_PATH:-..}:rw
      # Mount task-flows directory
      - ./task-flows:/app/task-flows:rw
      # Mount workflows database
      - ./workflows.db:/app/workflows.db:rw
    depends_on:
      inngest:
        condition: service_healthy
      appserver:
        condition: service_started
    networks:
      - devteam

  # Dashboard Client - Frontend
  client:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:client
    working_dir: /app/dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001
    depends_on:
      - server
    networks:
      - devteam

  # Worker - Inngest worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:worker
    working_dir: /app/dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: development
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      INNGEST_DEV: ${INNGEST_DEV:-0}
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_GATEWAY_URL: ws://inngest:8289/v0/connect
      CODEX_APP_SERVER_URL: ws://appserver:9876
      DASHBOARD_APP_SERVER_AUTO_APPROVE: ${DASHBOARD_APP_SERVER_AUTO_APPROVE:-true}
      DEVTEAM_AGENT_CONCURRENCY: ${DEVTEAM_AGENT_CONCURRENCY:-3}
      DEVTEAM_AGENT_TIMEOUT: ${DEVTEAM_AGENT_TIMEOUT:-6h}
      DEVTEAM_BLOCKED_TTL: ${DEVTEAM_BLOCKED_TTL:-30d}
      DASHBOARD_CODEX_HOME: /codex-home
    volumes:
      # Mount codex home from host
      - ${CODEX_HOME:-~/.codex}:/codex-home:rw
      # Mount workspace for agents to access
      - ${WORKSPACE_PATH:-..}:${WORKSPACE_PATH:-..}:rw
      # Mount task-flows directory
      - ./task-flows:/app/task-flows:rw
      # Mount workflows database
      - ./workflows.db:/app/workflows.db:rw
    depends_on:
      inngest:
        condition: service_healthy
      appserver:
        condition: service_started
    networks:
      - devteam

networks:
  devteam:
    driver: bridge

volumes:
  inngest-data:
