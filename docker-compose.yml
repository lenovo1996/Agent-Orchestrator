services:
  # Inngest - Event queue
  inngest:
    image: inngest/inngest:v1.39.0
    command: ["inngest", "start"]
    restart: unless-stopped
    network_mode: host
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?set INNGEST_EVENT_KEY in .env}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?set INNGEST_SIGNING_KEY in .env}
      INNGEST_SQLITE_DIR: /data
    volumes:
      - inngest-data:/data
    healthcheck:
      test: ["CMD", "inngest", "alpha", "doctor", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Dashboard Server - API
  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:server
    working_dir: /app/dashboard
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: development
      PORT: 3001
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      INNGEST_DEV: ${INNGEST_DEV:-0}
      INNGEST_BASE_URL: http://127.0.0.1:8288
      INNGEST_GATEWAY_URL: ws://127.0.0.1:8289/v0/connect
      DEVTEAM_DB_PATH: /devteam-state/workflows.db
      # Keep artifact paths identical in Docker and in the host app-server.
      DEVTEAM_TASK_FLOWS_DIR: ${WORKSPACE_PATH:-..}/.dev-team/task-flows
      DEVTEAM_WORKER_HEALTH_URL: ${DEVTEAM_WORKER_HEALTH_URL:-http://127.0.0.1:3011}
      CODEX_APP_SERVER_URL: ${CODEX_APP_SERVER_URL:-ws://127.0.0.1:9876}
      DASHBOARD_APP_SERVER_AUTO_APPROVE: ${DASHBOARD_APP_SERVER_AUTO_APPROVE:-true}
      DEVTEAM_AGENT_CONCURRENCY: ${DEVTEAM_AGENT_CONCURRENCY:-3}
      DEVTEAM_AGENT_TIMEOUT: ${DEVTEAM_AGENT_TIMEOUT:-6h}
      DEVTEAM_BLOCKED_TTL: ${DEVTEAM_BLOCKED_TTL:-30d}
      CODEX_HOME: /codex-home
      DASHBOARD_CODEX_HOME: /codex-home
    volumes:
      # Mount codex home from host
      - ${CODEX_HOME:-~/.codex}:/codex-home:rw
      # Mount workspace for agents to access
      - ${WORKSPACE_PATH:-..}:${WORKSPACE_PATH:-..}:rw
      # Share the SQLite database directory so WAL/SHM sidecars are visible to the worker
      - ./:/devteam-state:rw
    depends_on:
      inngest:
        condition: service_healthy

  # Dashboard Client - Frontend
  client:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:client
    working_dir: /app/dashboard
    restart: unless-stopped
    network_mode: host
    environment:
      VITE_API_URL: http://127.0.0.1:3001
    depends_on:
      - server

  # Worker - Inngest worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:worker
    working_dir: /app/dashboard
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: development
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      INNGEST_DEV: ${INNGEST_DEV:-0}
      INNGEST_BASE_URL: http://127.0.0.1:8288
      INNGEST_GATEWAY_URL: ws://127.0.0.1:8289/v0/connect
      DEVTEAM_DB_PATH: /devteam-state/workflows.db
      # Keep artifact paths identical in Docker and in the host app-server.
      DEVTEAM_TASK_FLOWS_DIR: ${WORKSPACE_PATH:-..}/.dev-team/task-flows
      DEVTEAM_WORKER_HEALTH_PORT: ${DEVTEAM_WORKER_HEALTH_PORT:-3011}
      CODEX_APP_SERVER_URL: ${CODEX_APP_SERVER_URL:-ws://127.0.0.1:9876}
      DASHBOARD_APP_SERVER_AUTO_APPROVE: ${DASHBOARD_APP_SERVER_AUTO_APPROVE:-true}
      DEVTEAM_AGENT_CONCURRENCY: ${DEVTEAM_AGENT_CONCURRENCY:-3}
      DEVTEAM_AGENT_TIMEOUT: ${DEVTEAM_AGENT_TIMEOUT:-6h}
      DEVTEAM_BLOCKED_TTL: ${DEVTEAM_BLOCKED_TTL:-30d}
      DASHBOARD_CODEX_HOME: /codex-home
    volumes:
      # Mount codex home from host
      - ${CODEX_HOME:-~/.codex}:/codex-home:rw
      # Mount workspace for agents to access
      - ${WORKSPACE_PATH:-..}:${WORKSPACE_PATH:-..}:rw
      # Share the SQLite database directory so WAL/SHM sidecars are visible to the server
      - ./:/devteam-state:rw
    depends_on:
      inngest:
        condition: service_healthy

volumes:
  inngest-data:
